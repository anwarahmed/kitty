# macOS (work laptop). Included from kitty.conf. These are the settings the
# macOS kitty.conf had (see the archive/macos tag), in the same order.

font_size 12.0
background_opacity 0.9
background_blur 15
macos_quit_when_last_window_closed yes
macos_colorspace displayp3

font_family      family="MesloLGS Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto

# Grape theme
include current-theme.conf
